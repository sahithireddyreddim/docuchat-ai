services:
  - type: web
    name: docuchat-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    disk:
      name: data
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.10

      - key: UPLOAD_DIR
        value: /data/uploads

      - key: CHROMA_DIR
        value: /data/chroma_db

      - key: DATABASE_URL
        value: sqlite+aiosqlite:////data/docuchat.db
